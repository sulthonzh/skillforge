<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="winner-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="loser-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1000" height="420" fill="url(#bg-grad)"/>
  <rect width="1000" height="420" fill="url(#grid)" opacity="0.45"/>

  <!-- left: title block -->
  <text x="60" y="135" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">SkillForge</text>
  <rect x="62" y="158" width="220" height="6" fill="url(#accent)" rx="3"/>

  <text x="60" y="220" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="28" font-weight="500">A Homebrew for AI skills</text>

  <text x="60" y="285" fill="#94a3b8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17">plan  →  generate  →  install  →  compare</text>

  <text x="60" y="350" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="500">github.com/sulthonzh/skillforge</text>

  <!-- right: comparison cards (the eval-harness centerpiece) -->
  <!-- winner card -->
  <g transform="translate(560, 75)">
    <rect x="0" y="0" width="170" height="270" rx="14" fill="#020617" stroke="url(#winner-grad)" stroke-width="3"/>
    <rect x="0" y="0" width="170" height="32" rx="14" fill="url(#winner-grad)"/>
    <rect x="0" y="18" width="170" height="14" fill="url(#winner-grad)"/>
    <text x="85" y="22" fill="#022c22" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle" font-weight="800" letter-spacing="2.5">WINNER</text>
    <text x="85" y="100" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="56" text-anchor="middle" font-weight="800">9.2</text>
    <text x="85" y="125" fill="#10b981" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" font-weight="600">/ 10.0</text>
    <line x1="20" y1="148" x2="150" y2="148" stroke="#1e293b" stroke-width="1"/>
    <text x="85" y="175" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" font-weight="600">backend-</text>
    <text x="85" y="190" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" font-weight="600">fastapi-</text>
    <text x="85" y="205" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" font-weight="600">postgres</text>
    <text x="85" y="235" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle" font-weight="600">v0.3.1 · 47 prompts</text>
    <text x="85" y="252" fill="#475569" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">by @alice</text>
  </g>

  <!-- vs badge -->
  <g transform="translate(750, 200)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="5" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle" font-weight="800" letter-spacing="0.5">vs</text>
  </g>

  <!-- other card -->
  <g transform="translate(780, 75)">
    <rect x="0" y="0" width="170" height="270" rx="14" fill="#020617" stroke="url(#loser-grad)" stroke-width="2"/>
    <text x="85" y="100" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="56" text-anchor="middle" font-weight="800">7.8</text>
    <text x="85" y="125" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" font-weight="600">/ 10.0</text>
    <line x1="20" y1="148" x2="150" y2="148" stroke="#1e293b" stroke-width="1"/>
    <text x="85" y="175" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" font-weight="600">backend-</text>
    <text x="85" y="190" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" font-weight="600">fastapi-</text>
    <text x="85" y="205" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" font-weight="600">postgres</text>
    <text x="85" y="235" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle" font-weight="600">v1.2.0 · 47 prompts</text>
    <text x="85" y="252" fill="#475569" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">by @bob</text>
  </g>
</svg>
