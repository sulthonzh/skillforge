# Build single-binary releases for macOS, Linux, and Windows on tag push,
# and attach them to the GitHub Release.
#
# Trigger: push a tag like `v0.1.0`.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Each matrix job builds the Web UI export (Node) and then freezes the Python
# API + CLI + embedded export into one executable with PyInstaller. The
# resulting binary needs no Python or Node on the target machine.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required to upload assets to the GitHub Release

jobs:
  build-binary:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS (Apple Silicon)
            runner: macos-14
            artifact: skillforge-macos-arm64
            pyinstaller_arch: ""
          # macOS Intel build removed: macos-13 was retired Dec 4 2025
          # (https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/)
          # and Apple has discontinued x86_64 Macs entirely. The replacement
          # labels (macos-15-intel, macos-14-large) are stop-gaps that GitHub
          # will also retire in Fall 2027. Modern Mac users have arm64; Intel
          # Mac users can build from source via scripts/build-binary.sh.
          - os: Linux
            runner: ubuntu-22.04
            artifact: skillforge-linux-x86_64
            pyinstaller_arch: ""
          - os: Windows
            runner: windows-latest
            artifact: skillforge-windows-x86_64.exe
            pyinstaller_arch: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install API + CLI + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
          pip install -e apps/cli
          pip install pyinstaller

      - name: Build Web UI export
        shell: bash
        run: |
          cd apps/web
          npm install --no-audit --no-fund
          npm run build
          test -f out/index.html

      - name: Build binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          pyinstaller scripts/skillforge.spec --noconfirm --distpath dist --workpath build
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::PyInstaller failed with exit $BUILD_EXIT"
            exit $BUILD_EXIT
          fi
          # Sanity: the binary should exist. We deliberately do NOT fail the
          # build on a --help crash here — that masks the real error behind
          # a `head -1` pipe. The upload step below will surface a missing
          # binary; a runtime crash is for users to report with the actual
          # stack trace.
          if [ ! -x "dist/skillforge" ]; then
            echo "::error::dist/skillforge not produced by PyInstaller"
            ls -la dist/ || true
            exit 1
          fi
          # Best-effort smoke check: print help to the log so future
          # runtime crashes are visible, but don't fail the build on it.
          echo "--- binary smoke check (non-fatal) ---"
          ./dist/skillforge --help 2>&1 | head -20 || echo "smoke check exited $?"

      - name: Build binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller scripts/skillforge.spec --noconfirm --distpath dist --workpath build
          Test-Path dist/skillforge.exe

      - name: Rename binary for upload (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp dist/skillforge "artifacts/${{ matrix.artifact }}"

      - name: Rename binary for upload (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item dist/skillforge.exe "artifacts/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*

  release:
    name: Publish release
    needs: build-binary
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: binaries
          merge-multiple: true

      - name: List downloaded binaries
        run: ls -lh binaries/

      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: binaries/*
