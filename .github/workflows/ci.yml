# Run tests, lint, typecheck, and web build on every push and pull request.
# Tests use the mock AI provider, so they run fully offline with no secrets.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Lint Python
        run: ruff check apps/api apps/cli

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install API with dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      - name: Run tests
        working-directory: apps/api
        env:
          SKILLFORGE_AI_PROVIDER: mock
        run: pytest -q

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: |
          npm run build
          test -f out/index.html
