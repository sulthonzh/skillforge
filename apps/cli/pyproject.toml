[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillforge-cli"
version = "0.1.0"
description = "SkillForge CLI — plan, generate, install, and manage local engineering skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SkillForge Contributors" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "skillforge-api",
]

[project.scripts]
skillforge = "skillforge_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["skillforge_cli"]
